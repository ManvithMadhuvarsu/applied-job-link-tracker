<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Saved Job Applications</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Saved Applications</h1>
          <p id="summary">Loading saved links...</p>
        </div>
      </header>

      <section class="toolbar" aria-label="Saved link actions">
        <label class="select-all">
          <input id="selectAll" type="checkbox">
          <span>Select all</span>
        </label>
        <span id="selectionSummary" class="selection-summary">0 selected</span>
        <button id="copyLinks" type="button">Copy</button>
        <button id="exportCsv" type="button">CSV</button>
        <button id="exportJson" type="button">JSON</button>
        <button id="deleteSelected" type="button" class="danger">Delete</button>
        <button id="clearAll" type="button" class="danger secondary">Clear All</button>
      </section>

      <section id="emptyState" class="empty" hidden>
        Applications will appear here after the extension detects a submitted job application.
      </section>

      <ol id="applications" class="applications"></ol>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
